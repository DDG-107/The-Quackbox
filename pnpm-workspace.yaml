packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# pnpm 11+ blocks dependency lifecycle scripts unless approved here.
# esbuild (via tsx and vite) needs its postinstall to pick the platform binary,
# electron's postinstall downloads the runtime binary.
allowBuilds:
  esbuild: true
  electron: true
  # electron-builder pulls this in for Squirrel.Windows, a target we do not use.
  electron-winstaller: false
