<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tap Race</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Everybody taps, nobody watches the TV</p>
          <h1>Tap Race</h1>
        </div>
        <div class="clock"><span id="clock">20</span>s</div>
      </header>

      <section class="stats">
        <div><strong id="total">0</strong><span>total taps</span></div>
        <div><strong id="players">0</strong><span>players</span></div>
        <div><strong id="leader">–</strong><span>leader</span></div>
      </section>

      <ol class="board" id="board"></ol>

      <footer id="status">Tap TAP! on your phone</footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
